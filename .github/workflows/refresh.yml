name: refresh-hub

on:
  # Two triggers on purpose. The external cron (cron-job.org) gives the fast
  # 15-min cadence but dies silently when its token expires — that cost us 15
  # days of a frozen hub. GitHub's own schedule is slower and throttled, but it
  # needs no credential and never expires, so it is the floor that keeps the hub
  # alive on its own. Concurrency + the no-change commit guard make overlap safe.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write             # allow the job to commit the updated data.json

concurrency:
  group: refresh-hub
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python collector.py

      - name: commit updated data
        run: |
          git config user.name  "media-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "hub: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            # a manual push can land mid-run and reject ours as non-fast-forward;
            # data.json is fully regenerated each run, so rebasing onto it is safe
            for attempt in 1 2 3; do
              git pull --rebase --autostash && git push && exit 0
              echo "push attempt $attempt lost the race, retrying"
              sleep 5
            done
            exit 1
          fi
